<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Die drei ??? - Ranking</title>
    
    <!-- PWA / App Installation -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #FFFFFF;
            --red: #ED1C24;
            --cyan: #00AEEF;
            --black: #000000;
            --dark-gray: #101010;
            --card-gray: #171717;
            --text-light: #F5F5F5;
            --muted: #A3A3A3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--black); color: var(--text-light); line-height: 1.6; padding-bottom: 80px; }
        
        header { background-color: var(--black); border-bottom: 2px solid var(--card-gray); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Anton', sans-serif; font-size: 24px; text-transform: uppercase; color: white; }
        .logo span:nth-child(1) { color: var(--white); } .logo span:nth-child(2) { color: var(--red); } .logo span:nth-child(3) { color: var(--cyan); }
        .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; background: var(--card-gray); padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: 600; border: 1px solid rgba(255,255,255,0.14); }
        
        .tabs { display: flex; justify-content: space-around; background: var(--black); padding: 10px; border-bottom: 1px solid var(--card-gray); }
        .tab-btn { background: none; border: none; color: var(--muted); font-size: 14px; font-weight: 600; padding: 10px 15px; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: white; border-bottom-color: var(--cyan); }
        
        .content-section { display: none; padding: 20px; max-width: 800px; margin: 0 auto; }
        .content-section.active { display: block; animation: fadeIn 0.3s; }
        .list-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .list-filters select { margin: 0; }
        .rated-filter { display: flex; align-items: center; gap: 9px; color: var(--text-light); font-size: 14px; }
        .rated-filter input { width: 18px; height: 18px; margin: 0; accent-color: var(--cyan); }
        @media (max-width: 520px) { .list-filters { grid-template-columns: 1fr; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: var(--dark-gray); border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.12); }
        h2 { font-family: 'Anton', sans-serif; font-size: 22px; color: white; margin-bottom: 15px; }
        
        .btn { background: var(--card-gray); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 12px 20px; border-radius: 8px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: var(--cyan); color: var(--black); border: none; }
        .btn-action { background: var(--red); color: white; border: none; }
        
        input, select, textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        
        .rating-scale { display: flex; justify-content: space-between; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 5px; margin-bottom: 20px; }
        .rating-btn { flex: 1; background: transparent; border: none; color: var(--muted); padding: 10px 0; font-weight: bold; font-size: 16px; border-radius: 6px; }
        .rating-btn.selected { background: var(--cyan); color: var(--black); }
        
        .rating-tag { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 14px; font-weight: bold; background: rgba(0, 174, 239, 0.16); color: var(--cyan); }
        
        /* Cover Image Styles */
        .cover-img-daily { width: 100%; max-width: 300px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); margin: 0 auto 20px auto; display: block; border: 2px solid var(--card-gray); }
        .music-links { display: flex; justify-content: center; gap: 10px; margin: -5px 0 20px; }
        .music-link { display: inline-block; padding: 9px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: var(--text-light); background: var(--card-gray); text-decoration: none; font-size: 13px; font-weight: 600; }
        .music-link:hover { border-color: var(--cyan); }
        .list-item { display: flex; gap: 15px; align-items: start; margin-bottom: 15px; }
        .cover-img-list { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--dark-gray); width: 90%; max-width: 400px; padding: 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>?</span><span>?</span><span>?</span> Ranking</div>
        <div class="user-profile" onclick="openUserModal()">👤 <span id="currentUserNameDisplay">Gast</span></div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-daily')">🎲 Fall des Tages</button>
        <button class="tab-btn" onclick="switchTab('tab-rate')">✍️ Bewerten</button>
        <button class="tab-btn" onclick="switchTab('tab-list')">📚 Folgen</button>
        <button class="tab-btn" onclick="switchTab('tab-reviews')">⭐ Reviews</button>
    </div>

    <!-- TAB 1: FALL DES TAGES -->
    <div id="tab-daily" class="content-section active">
        <div class="card" style="text-align: center;">
            <h2>Dein Fall des Tages</h2>
            <div id="daily-content">Lade Daten...</div>
            <button class="btn" onclick="generateDailyCase()">🔄 Neu Mischen</button>
        </div>
    </div>

    <!-- TAB 2: BEWERTEN -->
    <div id="tab-rate" class="content-section">
        <div class="card">
            <h2>Folge bewerten</h2>
            <select id="rate-select"><option value="">Lade Folgen...</option></select>
            <label>Punkte (1-10)</label>
            <div class="rating-scale" id="rating-scale-container"></div>
            <textarea id="rate-comment" rows="3" placeholder="Wie fandest du die Folge?"></textarea>
            <button class="btn btn-primary" id="rating-submit-btn" onclick="submitRating()">📝 Bewertung abgeben</button>
            <button class="btn" id="rating-cancel-edit-btn" onclick="cancelEditRating()" style="display:none;">Bearbeiten abbrechen</button>
        </div>
    </div>

    <!-- TAB 3: ALLE FOLGEN -->
    <div id="tab-list" class="content-section">
        <input type="text" id="search-input" placeholder="🔍 Suche Titel oder Nummer..." onkeyup="renderFolgenList()">
        <div class="list-filters">
            <label class="rated-filter"><input type="checkbox" id="rated-only-filter" onchange="renderFolgenList()"> Nur bewertete Folgen</label>
            <select id="list-filter-user" onchange="renderFolgenList()"><option value="all">Bewertungen aller Nutzer</option></select>
            <select id="list-sort" onchange="renderFolgenList()" aria-label="Folgen sortieren">
                <option value="number-asc">Nummer aufsteigend</option>
                <option value="number-desc">Nummer absteigend</option>
                <option value="rating-asc">Bewertung aufsteigend</option>
                <option value="rating-desc">Bewertung absteigend</option>
            </select>
        </div>
        <div id="folgen-list" style="margin-top: 20px;">Lade Daten...</div>
    </div>

    <!-- TAB 4: REVIEWS -->
    <div id="tab-reviews" class="content-section">
        <select id="review-filter-user" onchange="renderReviews()"><option value="all">Alle Nutzer</option></select>
        <div id="reviews-list" style="margin-top: 20px;">Lade Daten...</div>
    </div>

    <!-- USER MODAL -->
    <div class="modal-overlay" id="userModal">
        <div class="modal-content">
            <h2 style="color: white; margin-bottom: 20px;">Dein Profil</h2>
            <input type="text" id="usernameInput" placeholder="Dein Name (z.B. Justus)">
            <button class="btn btn-primary" onclick="saveUser()">Speichern</button>
            <button class="btn" onclick="closeUserModal()">Abbrechen</button>
        </div>
    </div>

    <script>
        // --- PWA SERVICE WORKER REGISTRIERUNG ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registriert'))
                    .catch(err => console.error('Service Worker Fehler:', err));
            });
        }

        // --- HIER DEINE GOOGLE SCRIPT URL EINTRAGEN ---
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzGNV5NolwtW2xQqapiMfcku8V_2KmEKU9ThOzO_TgOvi8BZIIjvm0hg6AHV7fENmmLKg/exec";
        
        let stammdaten = [], bewertungen = [], nutzer = [];
        let selectedPoints = 0, dailyFolge = null, editingRatingId = null;
        let currentUser = { id: localStorage.getItem('d3_userId') || 'user_' + Math.random().toString(36).substr(2, 9), name: localStorage.getItem('d3_userName') || '' };

        window.onload = () => { initUser(); initRatingScale(); fetchData(); };

        function initUser() {
            if (!currentUser.name) openUserModal();
            else document.getElementById('currentUserNameDisplay').textContent = currentUser.name;
        }
        function openUserModal() { document.getElementById('usernameInput').value = currentUser.name; document.getElementById('userModal').classList.add('active'); }
        function closeUserModal() { if(currentUser.name) document.getElementById('userModal').classList.remove('active'); }
        function saveUser() {
            const name = document.getElementById('usernameInput').value.trim();
            if (name) { currentUser.name = name; localStorage.setItem('d3_userId', currentUser.id); localStorage.setItem('d3_userName', name); document.getElementById('currentUserNameDisplay').textContent = name; closeUserModal(); updateUserFilter(); renderReviews(); generateDailyCase(); }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            if(tabId === 'tab-daily') generateDailyCase();
        }

        async function fetchData() {
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                const data = await res.json();
                stammdaten = data.stammdaten; bewertungen = data.bewertungen; nutzer = data.nutzer;
                populateDropdown(); updateUserFilter(); renderFolgenList(); renderReviews(); generateDailyCase();
            } catch (err) { console.error(err); }
        }

        function populateDropdown() {
            const sel = document.getElementById('rate-select');
            sel.innerHTML = '<option value="">-- Folge auswählen --</option>';
            stammdaten.forEach(f => {
                let opt = document.createElement('option'); opt.value = f.nr; opt.textContent = `Folge ${f.nr}: ${f.titel}`; sel.appendChild(opt);
            });
        }

        function updateUserFilter() {
            const sel = document.getElementById('review-filter-user');
            const listSel = document.getElementById('list-filter-user');
            const previousListUser = listSel.value || 'all';
            sel.innerHTML = '<option value="all">Alle Nutzer</option>';
            listSel.innerHTML = '<option value="all">Bewertungen aller Nutzer</option>';
            [...new Set(bewertungen.map(b => b.nutzerName))].filter(n=>n).forEach(n => {
                let opt = document.createElement('option'); opt.value = n; opt.textContent = n; sel.appendChild(opt);
                let listOpt = document.createElement('option'); listOpt.value = n; listOpt.textContent = `Nur ${n}`; listSel.appendChild(listOpt);
            });
            if ([...listSel.options].some(option => option.value === previousListUser)) listSel.value = previousListUser;
        }

        function initRatingScale() {
            const c = document.getElementById('rating-scale-container'); c.innerHTML = '';
            for(let i=1; i<=10; i++) {
                let b = document.createElement('button'); b.className = 'rating-btn'; b.textContent = i;
                b.onclick = () => { selectedPoints = i; document.querySelectorAll('.rating-btn').forEach(x => x.classList.remove('selected')); b.classList.add('selected'); };
                c.appendChild(b);
            }
        }

        async function submitRating() {
            const nr = document.getElementById('rate-select').value;
            const kommentar = document.getElementById('rate-comment').value;
            if(!currentUser.name || !nr || selectedPoints === 0) return alert("Bitte alles ausfüllen!");

            const payload = { action: editingRatingId === null ? 'addRating' : 'updateRating', nutzerId: currentUser.id, nutzerName: currentUser.name, folgenNr: parseInt(nr), punkte: selectedPoints, kommentar: kommentar };
            if (editingRatingId !== null) payload.id = editingRatingId;
            
            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            
            if (editingRatingId !== null) {
                const review = bewertungen.find(b => String(b.id) === String(editingRatingId));
                if (review) {
                    review.folgenNr = parseInt(nr);
                    review.punkte = selectedPoints;
                    review.kommentar = kommentar;
                    review.datum = new Date().toISOString();
                }
            } else {
                bewertungen.push({ id: Date.now(), nutzerId: currentUser.id, nutzerName: currentUser.name, folgenNr: parseInt(nr), punkte: selectedPoints, kommentar: kommentar, datum: new Date().toISOString() });
            }
            
            document.getElementById('rate-select').value = ""; document.getElementById('rate-comment').value = "";
            selectedPoints = 0; document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
            editingRatingId = null;
            document.getElementById('rating-submit-btn').textContent = 'Bewertung abgeben';
            document.getElementById('rating-cancel-edit-btn').style.display = 'none';
            
            updateUserFilter(); renderReviews(); renderFolgenList(); switchTab('tab-reviews');
        }

        function editRating(id) {
            const review = bewertungen.find(b => String(b.id) === String(id));
            if (!review || (review.nutzerId ? review.nutzerId !== currentUser.id : review.nutzerName !== currentUser.name)) return;

            editingRatingId = review.id;
            document.getElementById('rate-select').value = review.folgenNr;
            document.getElementById('rate-comment').value = review.kommentar || '';
            selectedPoints = parseInt(review.punkte, 10);
            document.querySelectorAll('.rating-btn').forEach((button, index) => button.classList.toggle('selected', index + 1 === selectedPoints));
            document.getElementById('rating-submit-btn').textContent = 'Änderungen speichern';
            document.getElementById('rating-cancel-edit-btn').style.display = 'block';
            switchTab('tab-rate');
        }

        function cancelEditRating() {
            editingRatingId = null;
            selectedPoints = 0;
            document.getElementById('rate-select').value = '';
            document.getElementById('rate-comment').value = '';
            document.querySelectorAll('.rating-btn').forEach(button => button.classList.remove('selected'));
            document.getElementById('rating-submit-btn').textContent = 'Bewertung abgeben';
            document.getElementById('rating-cancel-edit-btn').style.display = 'none';
        }

        function getStats(nr, nutzerName = null) {
            const f = bewertungen.filter(b => b.folgenNr === nr && (!nutzerName || b.nutzerName === nutzerName));
            if(f.length === 0) return { avg: '-', count: 0 };
            return { avg: (f.reduce((a, c) => a + parseInt(c.punkte), 0) / f.length).toFixed(1), count: f.length };
        }

        function prefill(nr) { document.getElementById('rate-select').value = nr; switchTab('tab-rate'); }

        function getCoverUrl(nr) {
            return `./ddf_covers/ddf_folge_${String(nr).padStart(3, '0')}.jpg`;
        }

        function getMusicLinks(folge) {
            const query = encodeURIComponent(`Die drei ??? Folge ${folge.nr} ${folge.titel}`);
            return `<div class="music-links">
                <a class="music-link" href="https://open.spotify.com/search/${query}" target="_blank" rel="noopener noreferrer">Spotify</a>
                <a class="music-link" href="https://music.apple.com/de/search?term=${query}" target="_blank" rel="noopener noreferrer">Apple Music</a>
            </div>`;
        }

        function showCoverFallback(image) {
            const fallback = document.createElement('div');
            fallback.className = image.className;
            fallback.textContent = image.classList.contains('cover-img-daily') ? 'Kein Cover vorhanden' : 'Kein Bild';
            fallback.style.cssText = 'background:#171717; display:flex; align-items:center; justify-content:center; text-align:center; font-size:12px;';
            if (image.classList.contains('cover-img-daily')) fallback.style.height = '250px';
            image.replaceWith(fallback);
        }

        // --- RENDER LISTENANSICHT (MIT COVER) ---
        function renderFolgenList() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const ratedOnly = document.getElementById('rated-only-filter').checked;
            const selectedUser = document.getElementById('list-filter-user').value;
            const sortMode = document.getElementById('list-sort').value;
            const c = document.getElementById('folgen-list'); c.innerHTML = '';
            
            const folgen = stammdaten.filter(f => f.titel.toLowerCase().includes(term) || f.nr.toString().includes(term))
                .filter(f => !ratedOnly || bewertungen.some(b => b.folgenNr === f.nr))
                .filter(f => selectedUser === 'all' || bewertungen.some(b => b.folgenNr === f.nr && b.nutzerName === selectedUser));
            folgen.sort((a, b) => {
                if (sortMode.startsWith('number')) return (a.nr - b.nr) * (sortMode.endsWith('desc') ? -1 : 1);
                const ratingA = parseFloat(getStats(a.nr, selectedUser === 'all' ? null : selectedUser).avg);
                const ratingB = parseFloat(getStats(b.nr, selectedUser === 'all' ? null : selectedUser).avg);
                const valueA = Number.isNaN(ratingA) ? (sortMode.endsWith('asc') ? Infinity : -Infinity) : ratingA;
                const valueB = Number.isNaN(ratingB) ? (sortMode.endsWith('asc') ? Infinity : -Infinity) : ratingB;
                return (valueA - valueB) * (sortMode.endsWith('desc') ? -1 : 1);
            });

            folgen.forEach(f => {
                const s = getStats(f.nr, selectedUser === 'all' ? null : selectedUser);
                // Cover-Fallback falls keine URL eingetragen wurde
                const coverHTML = `<img src="${getCoverUrl(f.nr)}" class="cover-img-list" alt="Cover Folge ${f.nr}" onerror="showCoverFallback(this)">`;
                
                c.innerHTML += `
                    <div class="card list-item">
                        ${coverHTML}
                        <div style="flex: 1;">
                            <div style="font-size:12px; color:var(--muted);">Folge ${f.nr} • ${f.jahr}</div>
                            <h3 style="font-size:16px; margin:5px 0;">${f.titel}</h3>
                            <div class="rating-tag">⭐ ${s.avg} (${s.count})</div>
                        </div>
                        <button class="btn btn-action" style="padding: 10px; width: auto;" onclick="prefill(${f.nr})">Bewerten</button>
                    </div>`;
            });
        }

        function renderReviews() {
            const u = document.getElementById('review-filter-user').value;
            const c = document.getElementById('reviews-list'); c.innerHTML = '';
            
            [...bewertungen].reverse().filter(b => u === 'all' || b.nutzerName === u).forEach(b => {
                const f = stammdaten.find(x => x.nr === b.folgenNr);
                const t = f ? f.titel : 'Unbekannt';
                const isOwnReview = b.nutzerId ? b.nutzerId === currentUser.id : b.nutzerName === currentUser.name;
                c.innerHTML += `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <b style="color:var(--cyan)">👤 ${b.nutzerName}</b> <span style="color:var(--muted); font-size:12px;">${new Date(b.datum).toLocaleDateString()}</span>
                        </div>
                        <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">Folge ${b.folgenNr}: ${t}</div>
                        <div><span class="rating-tag">⭐ ${b.punkte}/10</span> <i style="margin-left:10px;">${b.kommentar || ''}</i></div>
                        ${isOwnReview && b.id != null ? `<button class="btn btn-primary" style="margin-top:15px;" onclick="editRating(${JSON.stringify(b.id)})">Review bearbeiten</button>` : ''}
                    </div>`;
            });
        }

        // --- FALL DES TAGES (MIT COVER) ---
        function generateDailyCase() {
            const c = document.getElementById('daily-content');
            if(stammdaten.length === 0) return c.innerHTML = "Lade Daten...";
            
            const done = bewertungen.filter(b => b.nutzerName === currentUser.name).map(b => b.folgenNr);
            const open = stammdaten.filter(f => !done.includes(f.nr));
            
            if(open.length === 0) return c.innerHTML = "<h3>Alle bewertet!🏆</h3>";
            
            dailyFolge = open[Math.floor(Math.random() * open.length)];
            const s = getStats(dailyFolge.nr);
            
            const coverHTML = `<img src="${getCoverUrl(dailyFolge.nr)}" class="cover-img-daily" alt="Cover Folge ${dailyFolge.nr}" onerror="showCoverFallback(this)">`;
            const musicLinksHTML = getMusicLinks(dailyFolge);

            c.innerHTML = `
                ${coverHTML}
                ${musicLinksHTML}
                <div style="color: var(--muted); font-size:14px; font-weight:bold;">FOLGE ${dailyFolge.nr} • ${dailyFolge.jahr}</div>
                <h3 style="font-size:24px; margin: 10px 0;">${dailyFolge.titel}</h3>
                <div class="rating-tag" style="margin-bottom: 20px;">⭐ Community: ${s.avg} (${s.count} Votes)</div>
                <button class="btn btn-action" onclick="prefill(${dailyFolge.nr})">Diesen Fall bewerten</button>
            `;
        }
    </script>
</body>
</html>
